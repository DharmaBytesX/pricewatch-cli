# Release builds: archives for Linux, macOS and Windows, with checksums.
# The release workflow runs it on version tags; "goreleaser check" validates it.
version: 2
project_name: pricewatch

builds:
  - main: ./cmd/pricewatch
    binary: pricewatch
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/DharmaBytesX/pricewatch-cli/internal/version.Version={{ .Version }}
      - -X github.com/DharmaBytesX/pricewatch-cli/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/DharmaBytesX/pricewatch-cli/internal/version.Date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
