# golangci-lint v2 configuration. Run: make lint
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose      # HTTP response bodies are closed
    - copyloopvar
    - errorlint      # errors are compared with errors.Is / errors.As
    - gocritic
    - misspell
    - noctx          # HTTP requests carry a context
    - nolintlint     # every //nolint says which linter and why
    - predeclared    # no variable named like a builtin (max, len…)
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-return
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/DharmaBytesX/pricewatch-cli
